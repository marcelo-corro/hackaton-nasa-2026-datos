# Actualización diaria de los datos publicados (riesgo, sectores, incendios activos, comunas).
# Corre el back (repo público hackaton-nasa-2026-back) y publica aquí solo si pasan los tests y los controles
# (scripts/diario.py). Si algo falla no publica nada: queda en línea lo de ayer y GitHub avisa por correo.
# Los datos pesados (~1 GB) se guardan en la caché de Actions; si la caché no está, la corrida los descarga (1-2 h).
# Para probar una rama del back sin publicar: Run workflow con rama_back = <rama> (no publica ni guarda la caché).
name: Actualización diaria

on:
  schedule:
    # GitHub atrasa o se salta corridas programadas cuando tiene mucha carga, sobre todo al inicio de cada hora: la
    # del 20-11 a las 11:00 UTC no se lanzó. Por eso un minuto poco usado y una segunda corrida de respaldo, que solo
    # trabaja si ese día no se publicó (si la primera se saltó o falló, por ejemplo porque FIRMS se demoró).
    # Como GitHub tampoco lanzó el respaldo del 20-11 (y hay reportes iguales desde el 16-11), un servicio externo
    # (cron-job.org, cuenta del dueño del repo) lanza además workflow_dispatch con programada=true a las 11:20 y 14:50
    # UTC. Si dos corridas coinciden, concurrency las pone en fila y la segunda ve que ya se publicó.
    - cron: "17 11 * * *"  # principal: 08:17 en Chile con horario de verano (07:17 con horario de invierno)
    - cron: "47 14 * * *"  # respaldo: 11:47 en Chile con horario de verano
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar si todo sale bien (desmarcar para una prueba)"
        type: boolean
        default: true
      carga_completa:
        description: "Rehacer también lo que no cambia a diario (descargas, armonización, capas)"
        type: boolean
        default: false
      programada:
        description: "Tratar como corrida programada: no hace nada si hoy ya se publicó (para el disparador externo)"
        type: boolean
        default: false
      rama_back:
        description: "Rama del back. Con otra que main es solo una prueba: nunca publica ni guarda la caché"
        type: string
        default: main

permissions:
  contents: write   # commit de los datos en este repo
  pages: write      # pedir el build de GitHub Pages

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  # Una corrida programada (o lanzada desde afuera con programada=true) no hace nada si los datos de hoy (UTC) ya
  # están publicados. A mano siempre corre.
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROGRAMADA: ${{ github.event_name == 'schedule' || format('{0}', inputs.programada) == 'true' }}
    outputs:
      correr: ${{ steps.revisar.outputs.correr }}
    steps:
      - name: Manifest publicado
        if: env.PROGRAMADA == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: manifest.json
          sparse-checkout-cone-mode: false

      - name: ¿Ya se publicó hoy?
        id: revisar
        run: |
          echo "Evento: ${{ github.event_name }}; programada: $PROGRAMADA"
          if [ "$PROGRAMADA" != "true" ]; then echo "correr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hoy=$(date -u +%F)
          publicado=$(python3 -c "import json; print(json.load(open('manifest.json'))['generado_utc'][:10])" || echo "")
          if [ "$publicado" = "$hoy" ]; then
            echo "Los datos de hoy ya están publicados (generado_utc $publicado): esta corrida no hace nada."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Último publicado: ${publicado:-desconocido}; hoy es $hoy: corre la actualización."
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

  actualizar:
    needs: decidir
    if: needs.decidir.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      DATOS_REPO_DIR: ${{ github.workspace }}/datos
      PYTHONUNBUFFERED: "1"
      # Las corridas programadas no traen inputs: siempre main. Una rama distinta es una prueba (ver rama_back).
      RAMA_BACK: ${{ inputs.rama_back || 'main' }}
      ES_MAIN: ${{ (inputs.rama_back || 'main') == 'main' }}
    steps:
      - name: Repo de datos
        uses: actions/checkout@v4
        with:
          path: datos

      - name: Código del back
        uses: actions/checkout@v4
        with:
          repository: marcelo-corro/hackaton-nasa-2026-back
          ref: ${{ inputs.rama_back || 'main' }}
          path: back

      - name: Rama del back
        run: |
          echo "Back: rama $RAMA_BACK ($(git -C back rev-parse --short HEAD))"
          if [ "$ES_MAIN" != "true" ]; then
            echo "Prueba con la rama $RAMA_BACK del back: no publica ni guarda la caché." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements-ci.txt

      - name: Librerías (versiones fijas)
        run: pip install -r back/requirements-ci.txt

      - name: Datos de corridas anteriores (caché)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: back/data
          key: datos-v1-${{ github.run_id }}
          restore-keys: datos-v1-

      - name: Tests del back
        working-directory: back
        run: python -m pytest -q

      - name: Pipeline y controles
        id: pipeline
        working-directory: back
        run: python scripts/diario.py ${{ inputs.carga_completa && '--carga-completa' || '' }}

      - name: Guardar datos en la caché
        if: steps.pipeline.outcome == 'success' && env.ES_MAIN == 'true'
        uses: actions/cache/save@v4
        with:
          path: back/data
          key: datos-v1-${{ github.run_id }}

      - name: Archivos generados (para revisar)
        if: always() && steps.pipeline.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: public-${{ github.run_id }}
          path: back/public
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar
        if: steps.pipeline.outcome == 'success' && env.ES_MAIN == 'true' && (github.event_name == 'schedule' || inputs.publicar)
        working-directory: back
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Código 2 = push hecho pero Pages todavía no lo refleja: se pide el build y se verifica en el paso siguiente.
          python scripts/10_publicar.py || [ $? -eq 2 ]

      - name: Build de Pages y verificación
        if: steps.pipeline.outcome == 'success' && env.ES_MAIN == 'true' && (github.event_name == 'schedule' || inputs.publicar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
          esperado=$(python -c "import json; print(json.load(open('back/public/manifest.json'))['generado_utc'])")
          url="https://marcelo-corro.github.io/hackaton-nasa-2026-datos/manifest.json"
          for i in $(seq 1 40); do
            servido=$(curl -fsS "$url?nc=$RANDOM" | python -c "import json,sys; print(json.load(sys.stdin).get('generado_utc'))" || true)
            if [ "$servido" = "$esperado" ]; then echo "Pages sirve los datos nuevos ($esperado)."; exit 0; fi
            sleep 15
          done
          echo "Pages no sirve los datos nuevos tras 10 minutos (esperado $esperado, servido $servido)."
          exit 1
